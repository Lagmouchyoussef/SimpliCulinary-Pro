{% extends 'base/base.html' %}
{% load static crispy_forms_tags %}

{% block title %}Sign up — SimpliCulinary{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12">
        <div class="sc-auth">
            <div class="row g-0">
                <div class="col-12">
                    <div class="sc-auth-form">
                        <h1>Create your account</h1>
                        <p class="text-muted mb-4">It only takes a minute.</p>
                        <form method="post">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ next }}">
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Create account</button>
                        </form>
                        <p class="mt-4 mb-0 text-center text-muted">Already have an account? <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="fw-bold">Log in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
