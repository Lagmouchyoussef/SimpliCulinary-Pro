{% extends 'base/base.html' %}

{% block title %}Remove item — SimpliCulinary{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="sc-card sc-empty">
            <div class="sc-empty-icon" style="background:var(--sc-danger-soft);color:var(--sc-danger)"><i class="fas fa-trash-can"></i></div>
            <h1 class="h3 fw-bold">Remove this item?</h1>
            <p class="text-muted mb-4">Are you sure you want to remove <strong>{{ cartitem.product.name }}</strong> from your cart?</p>
            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <a href="{% url 'cart_detail' %}" class="btn btn-soft px-4">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">Remove</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
